name: Java Discovery Check

on:
  push:
    branches:
      - fix/java-discovery-scan

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Launcher.sln

      - name: Build
        run: dotnet build Launcher.sln -c Release --no-restore

      - name: Java discovery tests
        run: dotnet test Launcher.Tests/Launcher.Tests.csproj -c Release --no-build --filter FullyQualifiedName~JavaRuntimeDiscoveryService
